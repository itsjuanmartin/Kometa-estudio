<title>Centro de Canales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first. Four views (Hoy, Calendario, Contenido, Datos); tab bar sits at the bottom on phones and in the header on wide screens. Every piece opens a sheet with download, copys and per-platform status. */
:root{
  --bg:#f2f3f5; --panel:#ffffff; --sunk:#eceef2; --ink:#14171c; --muted:#5d6572; --line:#dadde3;
  --ytt:#a87900; --ytt-soft:#fbf0c4; --ao:#0b7f8a; --ao-soft:#d3f0f2; --bad:#c2410c; --c3:#5a54c4; --c3-soft:#e7e5fb;
  --ok:#17784a; --ok-soft:#d7f0e2; --todo:#9a5a00; --todo-soft:#fbe9cf; --prod:#4a5568; --prod-soft:#e4e7ec; --link:#6247d6; --acc:#6d4fe0; --acc-2:#8a6cf0; --acc-pink:#b768c9; --acc-soft:#efeaff; --acc-ink:#ffffff;
  --yt:#d42a20; --tt:#14171c; --ig:#c1358f;
  --f-display:"Archivo",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --panel:#171a20; --sunk:#1f232b; --ink:#e9ecf1; --muted:#99a2af; --line:#2a2f38;
  --ytt:#f3cd4c; --ytt-soft:#352d12; --ao:#4fd4dc; --ao-soft:#12343a; --bad:#ff8a65; --c3:#a8a3ff; --c3-soft:#25234a;
  --ok:#5cd39a; --ok-soft:#143323; --todo:#f2b45a; --todo-soft:#3a2a12; --prod:#aab4c3; --prod-soft:#262b33; --link:#b3a2ff; --acc:#8b72f2; --acc-2:#7a62e6; --acc-pink:#b77acb; --acc-soft:#241f3d; --acc-ink:#ffffff;
  --yt:#ff6b5f; --tt:#e9ecf1; --ig:#f07ac4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --panel:#171a20; --sunk:#1f232b; --ink:#e9ecf1; --muted:#99a2af; --line:#2a2f38;
  --ytt:#f3cd4c; --ytt-soft:#352d12; --ao:#4fd4dc; --ao-soft:#12343a; --bad:#ff8a65; --c3:#a8a3ff; --c3-soft:#25234a;
  --ok:#5cd39a; --ok-soft:#143323; --todo:#f2b45a; --todo-soft:#3a2a12; --prod:#aab4c3; --prod-soft:#262b33; --link:#b3a2ff; --acc:#8b72f2; --acc-2:#7a62e6; --acc-pink:#b77acb; --acc-soft:#241f3d; --acc-ink:#ffffff;
  --yt:#ff6b5f; --tt:#e9ecf1; --ig:#f07ac4; color-scheme:dark}
*{box-sizing:border-box}
html,body{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;height:52px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
nav.tabs{display:flex}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;flex:1;min-width:0}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--acc)}
nav.tabs a:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
@media (max-width:759px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
  main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px) !important}
  nav.tabs a[aria-current="page"] svg{stroke-width:2.4}
}
@media (min-width:760px){
  .topin{height:58px}
  nav.tabs{gap:4px;order:2}
  nav.tabs a{flex-direction:row;gap:7px;font-size:13.5px;padding:7px 12px;border-radius:9px}
  nav.tabs a svg{width:17px;height:17px}
  nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--panel)}
  .sync{order:3}
}
main{max-width:1100px;margin:0 auto;padding-block:18px 48px;display:grid;gap:20px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.1;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px;max-width:62ch}
.lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.sec{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.chip.ytt{background:var(--ytt-soft);color:var(--ytt)} .chip.ao{background:var(--ao-soft);color:var(--ao)} .chip.c3{background:var(--c3-soft);color:var(--c3)}
.pf{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;white-space:nowrap}
.pf b{width:8px;height:8px;border-radius:50%;display:inline-block}
.pf.yt b{background:var(--yt)} .pf.tt b{background:var(--tt)} .pf.ig b{background:var(--ig)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13.5px;min-height:40px;padding:0 14px;border-radius:10px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc-2));color:var(--acc-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 25%,transparent)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.empty{color:var(--muted);font-size:14px}
/* progress */
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
/* tasks */
.tasks{display:grid;gap:10px}
.task{display:grid;grid-template-columns:52px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;border-left:4px solid var(--c)}
.task.ytt{--c:var(--ytt)} .task.ao{--c:var(--ao)}
.task.done{opacity:.55}
.task img{width:52px;height:74px;object-fit:cover;border-radius:8px;background:var(--sunk)}
.task img.h{height:30px}
.task .t{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.task .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--muted)}
.task .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.timehead{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.timehead b{font-family:var(--f-mono);font-size:15px}
/* kpis */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.kcard{border-top:4px solid var(--c)} .kcard.ytt{--c:var(--ytt)} .kcard.ao{--c:var(--ao)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpi{background:var(--sunk);border-radius:10px;padding:9px 10px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.kpi .d{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.up{color:var(--ok)!important} .down{color:var(--bad)!important}
.soon{border:1.5px dashed var(--c3);background:var(--c3-soft);color:var(--c3);border-radius:16px;padding:14px;display:grid;gap:4px;align-content:center}
.soon b{font-family:var(--f-display);font-size:17px}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cday{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px;display:grid;align-content:start;gap:6px;min-width:0}
.cday.today{border:2px solid var(--ink)}
.cday .dn{display:flex;justify-content:space-between;align-items:baseline}
.cday .dn b{font-family:var(--f-display);font-size:15px}
.cev{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:2px;padding:6px 7px;border-radius:8px;background:var(--sunk);border-left:3px solid var(--c);min-width:0}
.cev.ytt{--c:var(--ytt)} .cev.ao{--c:var(--ao)}
.cev.long{background:var(--c);color:var(--panel)}
.cev.long .tm,.cev.long .pp{color:inherit;opacity:.85}
.cev.done{opacity:.5}
.cev .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.cev .tt{font-size:12px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.cev .pp{font-size:10.5px;color:var(--muted)}
.cev:focus-visible{outline:2px solid var(--link)}
@media (max-width:759px){
  .week{grid-template-columns:1fr}
  .cday{min-height:0}
  .cday.past{display:none}
  .cev{grid-template-columns:auto 1fr;column-gap:10px} .cev .tm{grid-row:span 2;align-self:center}
}
.slot{border-radius:10px;background:var(--sunk);border-left:3px solid var(--c);padding:7px 8px;display:grid;gap:6px;min-width:0}
.slot.ytt{--c:var(--ytt);--cs:var(--ytt-soft)} .slot.ao{--c:var(--ao);--cs:var(--ao-soft)}
.slot.long{background:var(--cs)}
.slot.done{opacity:.5}
.slot .shd{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:12px}
.slot .shd .tm{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.slot .shd .muted{color:var(--muted);font-size:11px}
.srow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;min-width:0}
.srow .tt{font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.srow:focus-visible{outline:2px solid var(--link)}
.stks{display:flex;gap:4px;flex-wrap:wrap}
.stk{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.stk.yt{background:#e1251b} .stk.tt{background:#111;box-shadow:inset 0 0 0 1px #555} .stk.ig{background:linear-gradient(45deg,#f09433,#dc2743 55%,#bc1888)}
.stk.ok{opacity:.55}
.weekhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:759px){.weekhead{display:none}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
/* content grid */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.filters button:focus-visible{outline:2px solid var(--link)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
@media (max-width:420px){.cgrid{grid-template-columns:1fr 1fr}}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:0;align-content:start}
.card:focus-visible{outline:2px solid var(--link)}
.card img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:9px;background:var(--sunk)}
.card.long img{aspect-ratio:16/9}
.card .t{font-weight:700;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{font-family:var(--f-mono);font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px}
.dot.subido{background:var(--ok-soft);color:var(--ok)} .dot.listo{background:var(--todo-soft);color:var(--todo)} .dot.produccion{background:var(--prod-soft);color:var(--prod)} .dot.revisar{background:var(--c3-soft);color:var(--c3)}
/* sheet */
dialog{border:none;padding:0;background:var(--panel);color:var(--ink);width:min(720px,100vw);max-width:100vw;max-height:100dvh;margin:auto}
@media (max-width:759px){dialog{width:100vw;height:100dvh;margin:0;border-radius:0}}
@media (min-width:760px){dialog{border-radius:18px;max-height:calc(100dvh - 40px)}}
dialog::backdrop{background:rgb(0 0 0 / .55)}
.sh{display:grid;gap:16px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.shh{position:sticky;top:0;z-index:2;background:var(--panel);display:flex;justify-content:flex-start;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.shh b{font-family:var(--f-display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.hero img{width:110px;border-radius:10px;aspect-ratio:9/16;object-fit:cover;background:var(--sunk)}
.hero.long{grid-template-columns:1fr}
.hero.long img{width:100%;aspect-ratio:16/9}
.prow{display:grid;grid-template-columns:1fr 150px;grid-template-areas:"pf st" "wh wh";gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .pf{grid-area:pf} .prow select{grid-area:st} .prow input{grid-area:wh}
@media (min-width:760px){.prow{grid-template-columns:110px 1fr 160px;grid-template-areas:"pf wh st"}}
.prow:last-child{border-bottom:none}
select.st,input.when{font:inherit;font-size:13px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
select.st.subido{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:700}
select.st.listo{background:var(--todo-soft);color:var(--todo);border-color:transparent;font-weight:700}
select.st.produccion{background:var(--prod-soft);color:var(--prod);border-color:transparent;font-weight:700}
select.st.revisar{background:var(--c3-soft);color:var(--c3);border-color:transparent;font-weight:700}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--link)}
.field{display:grid;gap:6px}
.field .fl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.field pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:14px;background:var(--sunk);border-radius:10px;padding:10px 12px;max-height:240px;overflow:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs figure{margin:0;display:grid;gap:6px}
.thumbs img{width:100%;border-radius:8px;display:block}
.thumbs figcaption{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
/* stats */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.r,th.r{text-align:right}
.tiny{width:30px;height:42px;object-fit:cover;border-radius:4px;background:var(--sunk);vertical-align:middle}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.chart{width:100%;height:auto;display:block}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.form input,.form select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%}
.note{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:none}
.note input{margin-top:3px;width:18px;height:18px;accent-color:var(--ok)}
.note.done b,.note.done p{color:var(--muted);text-decoration:line-through}
.note p{margin:3px 0 0;font-size:13.5px}
details.more summary{cursor:pointer;font-weight:700;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ▾";color:var(--muted)}
.banner{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}
@media (min-width:760px){.toast{bottom:24px}}

/* logos */
.clogo{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c,var(--line))}
.clogo.sm{width:26px;height:26px;box-shadow:none} .clogo.xs{width:18px;height:18px;box-shadow:none}
.chead{display:flex;align-items:center;gap:12px;min-width:0} .chead h2{margin:0} .chead .lab{display:block;margin-top:2px}
.btn.back{flex:none;font-weight:700}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--acc);box-shadow:0 1px 3px rgb(0 0 0 / .15)}
.sw.sq{background:transparent!important;border:2px solid var(--ink);border-radius:3px}
.mcal{padding:12px}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:10px} .mhead h2{margin:0;flex:1;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.mday{all:unset;box-sizing:border-box;cursor:pointer;min-height:64px;border-radius:10px;padding:5px;background:var(--sunk);display:flex;flex-direction:column;gap:4px;min-width:0;border:2px solid transparent}
.mday:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.mday .n{font-family:var(--f-display);font-weight:700;font-size:14px}
.mday.out{opacity:.35} .mday.past{opacity:.6}
.mday.today .n{background:var(--acc);color:var(--acc-ink);border-radius:999px;width:24px;height:24px;display:grid;place-items:center;font-size:13px}

/* ---- motion: app-like ---- */
:root{--ease:cubic-bezier(.22,.8,.24,1);--ease-out:cubic-bezier(.16,1,.3,1)}
header.top{view-transition-name:chrome} nav.tabs{view-transition-name:tabs}
::view-transition-group(chrome),::view-transition-group(tabs){animation:none}
::view-transition-old(chrome),::view-transition-new(chrome),::view-transition-old(tabs),::view-transition-new(tabs){animation:none}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(page){animation-duration:.38s;animation-timing-function:var(--ease-out)}
::view-transition-old(page){animation:.22s var(--ease) both vtOut}
::view-transition-new(page){animation:.38s var(--ease-out) both vtIn}
html[data-dir="back"]::view-transition-old(page){animation-name:vtOutBack}
html[data-dir="back"]::view-transition-new(page){animation-name:vtInBack}
@keyframes vtOut{to{opacity:0;transform:translateX(-24px) scale(.985)}}
@keyframes vtIn{from{opacity:0;transform:translateX(32px) scale(.985)}}
@keyframes vtOutBack{to{opacity:0;transform:translateX(24px) scale(.985)}}
@keyframes vtInBack{from{opacity:0;transform:translateX(-32px) scale(.985)}}
#app.enter-fwd{animation:.38s var(--ease-out) both vtIn} #app.enter-back{animation:.38s var(--ease-out) both vtInBack}
/* tab bar: icon pop + smooth color */
nav.tabs a{transition:color .25s var(--ease)} nav.tabs a svg{transition:transform .35s var(--ease-out)}
nav.tabs a[aria-current="page"] svg{transform:translateY(-1px) scale(1.12)}
/* press feedback everywhere */
.btn,.qt,.card,.crow,.ag,.pcard,.topc,.chopt,.fmopt,.gobtn,.mday,.task[data-card],.ichip,.fhb{transition:transform .18s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease),border-color .25s var(--ease),opacity .25s var(--ease)}
.btn:active,.qt:active,.crow:active,.ag:active,.pcard:active,.topc:active,.ichip:active,.fhb:active,.mday:active{transform:scale(.97)}
/* sheets & panels */
dialog[open]{animation:.42s var(--ease-out) both sheetUp} dialog[open]::backdrop{animation:.3s ease both fadeIn}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}} @keyframes fadeIn{from{opacity:0}}
#daypop{animation:.25s ease both fadeIn} #daypop .popc{animation:.38s var(--ease-out) both popIn}
@keyframes popIn{from{transform:translateY(16px) scale(.97);opacity:0}}
details[open]>.clist,details[open]>.sec,details.cmore[open]>input{animation:.32s var(--ease-out) both revealDown}
@keyframes revealDown{from{opacity:0;transform:translateY(-6px)}}
.csec>summary::after{transition:transform .3s var(--ease-out)}
.toast,#toast{transition:opacity .25s,transform .3s var(--ease-out)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;transition:none!important}}

.monbtn>span:last-child{grid-area:c;font-size:22px;color:var(--muted)} .monbtn:active{transform:scale(.98)}
.metahero{display:flex;gap:12px;align-items:center} .mh1{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,color-mix(in srgb,#30d158 30%,var(--panel)),color-mix(in srgb,var(--acc) 20%,var(--panel)))}
.mreq{display:grid;gap:5px} .mreq b{font-size:14px} .mreq .num{font-family:var(--f-mono);font-size:13px} .mreq i{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden} .mreq i b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#30d158,var(--acc))} .mreq small{color:var(--muted);font-size:12px}
.mtl{list-style:none;margin:0;padding:0;display:grid} .mtl li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.mtl li:not(:last-child)::before{content:'';position:absolute;left:16px;top:40px;bottom:-6px;width:2px;background:var(--line)} .mtl li.done:not(:last-child)::before{background:#30d158}
.mdot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:800;z-index:1} .mtl li.done .mdot{background:#30d158;color:#fff} .mtl li.next .mdot{box-shadow:0 0 0 3px var(--acc)}
.mtl small{display:block;color:var(--muted);font-size:12.5px}
.goalc .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.livec{border-color:color-mix(in srgb,#ff3b30 35%,var(--line))} .rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3b30;margin-right:6px;animation:recb 1.2s infinite}
@keyframes recb{50%{opacity:.25}}
.lframe{position:relative;border-radius:14px;overflow:hidden;background:#000} .lframe img{width:100%;display:block;max-height:360px;object-fit:contain} .lframe span{position:absolute;left:8px;bottom:8px;font-size:11.5px;font-weight:700;color:#fff;background:rgb(0 0 0 / .6);padding:3px 8px;border-radius:999px}
.lprog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center} .lprog>b{font-family:var(--f-mono);font-size:18px} .lprog i{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden} .lprog i b{display:block;height:100%;background:linear-gradient(90deg,var(--acc-2),var(--acc));transition:width .6s var(--ease-out)} .lprog small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.llog{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px} .llog li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;color:var(--muted)} .llog li span{font-family:var(--f-mono);font-size:12px} .llog li.cur{color:var(--ink);font-weight:600}
</style>

<main class="pad" id="app" style="view-transition-name:page"><div class="banner">Cargando tus canales…</div></main>

<dialog id="dlg" aria-label="Detalle de la pieza"><div id="dlb"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const PL={yt:'YouTube',tt:'TikTok',ig:'Instagram'}, ST={listo:'Por subir',subido:'Subido',produccion:'En producción',revisar:'Por confirmar'};
const S={channels:[],posts:[],stats:[],notes:[],tips:[],ideas:[],voices:[],drafts:[],goals:[],ready:{goals:false,channels:false,posts:false,stats:false,notes:false,tips:false,ideas:false,voices:false,drafts:false},filter:{st:'pendiente',ch:'all'}};
let db=null, dlCap;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=n=>n==null||n===''?'—':(n>=1000?(Math.round(n/100)/10).toLocaleString('es-ES')+' K':Number(n).toLocaleString('es-ES'));
const LOGO={ytt:'img/logo_ytt.jpg',ao:'img/logo_ao.jpg'};
const logoUrl=ch=>(S.channels.find(c=>c.id===ch)||{}).logoUrl||LOGO[ch];
const logo=(ch,cls='clogo')=>{const u=logoUrl(ch);if(u)return `<img class="${cls}" src="${esc(u)}" alt="">`;const c=S.channels.find(x=>x.id===ch);return c?`<span class="${cls} lettr" style="--c:var(--${ch},var(--acc))">${esc((c.name||'?').slice(0,1))}</span>`:''};
const chName=id=>(S.channels.find(c=>c.id===id)||{}).name||id;
const pfs=p=>(p.kind==='largo'?['yt']:['yt','tt','ig']).filter(pl=>!(p.skip||[]).includes(pl));
const ptitle=p=>p.kind==='largo'?`${p.ep} · Vídeo largo: ${p.epTitle}`:p.name;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2000)}

/* dates: plan values are "YYYY-MM-DD HH:MM" in Spain time */
function today(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
const addDays=(d,n)=>{const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const DOW=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'], MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dlong=d=>{const t=new Date(d+'T12:00:00Z');return `${DOW[t.getUTCDay()]} ${t.getUTCDate()} ${MON[t.getUTCMonth()]}`};
const dshort=d=>{const t=new Date(d+'T12:00:00Z');return `${DOW[t.getUTCDay()].slice(0,3)} ${t.getUTCDate()}`};

/* events = one per post+platform with a plan date */
function events(){
  const ev=[];
  for(const p of S.posts) for(const pl of pfs(p)){ const w=p.plan?.[pl]; if(!w) continue; ev.push({p,pl,d:w.slice(0,10),t:w.slice(11,16),st:p.st?.[pl]||'listo'}); }
  return ev.sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t)||a.p.ch.localeCompare(b.p.ch)||a.p.order-b.p.order);
}
/* group same post+time across platforms */
function grouped(list){const m=new Map();for(const e of list){const k=e.d+e.t+e.p.id;if(!m.has(k))m.set(k,{p:e.p,d:e.d,t:e.t,pls:[]});m.get(k).pls.push(e)}return [...m.values()]}

async function save(id,patch,msg){
  const p=S.posts.find(x=>x.id===id); if(!p||!db) return;
  Object.assign(p,patch); render(); if($('#dlg').open) openPost(id,true);
  try{ await db.collection('posts').doc(id).update(patch); if(msg) toast(msg); }catch(e){ toast('No se pudo guardar. Revisa la conexión.'); }
}
const setSt=(id,pl,val)=>{const p=S.posts.find(x=>x.id===id);save(id,{st:{...p.st,[pl]:val}},`${PL[pl]}: ${ST[val]}`)};
const setPlan=(id,pl,val)=>{const p=S.posts.find(x=>x.id===id);const plan={...(p.plan||{})};if(val)plan[pl]=val.replace('T',' ');else delete plan[pl];save(id,{plan},'Fecha guardada')};

/* downloads */
async function download(id,btn){
  const p=S.posts.find(x=>x.id===id); const dl=p?.dl; if(!dl){toast('Este vídeo no está en la nube');return}
  const label=btn?.textContent; const parts=dl.parts||[dl.url];
  try{
    if(dlCap===undefined) dlCap=await claude.use('downloads');
    const chunks=[]; for(let i=0;i<parts.length;i++){ if(btn) btn.textContent=parts.length>1?`Bajando ${i+1}/${parts.length}…`:'Bajando…'; const r=await fetch(parts[i]); if(!r.ok) throw new Error('fetch'); chunks.push(await r.blob()); }
    const blob=new Blob(chunks,{type:'video/mp4'});
    if(dlCap){ if(btn) btn.textContent='Guardando…'; await dlCap.save({filename:dl.name||p.file,data:blob}); toast('Vídeo guardado'); }
    else { const u=URL.createObjectURL(blob); window.open(u,'_blank'); toast('Ábrelo y guárdalo desde el menú del vídeo'); }
  }catch(e){ if(e?.code!=='dismissed'&&e?.code!=='declined') toast('No se pudo descargar. Vuelve a intentarlo.'); }
  finally{ if(btn) btn.textContent=label; }
}

/* ---------- HOY ---------- */
function taskCard(g){
  const p=g.p, allDone=g.pls.every(e=>e.st==='subido'), prod=g.pls.some(e=>e.st==='produccion');
  const plBtns=g.pls.map(e=>e.st==='subido'
    ? `<button class="btn sm ok" data-st="${p.id}" data-pl="${e.pl}" data-v="listo" aria-label="Desmarcar ${PL[e.pl]}">✓ ${PL[e.pl]}</button>`
    : `<button class="btn sm" data-st="${p.id}" data-pl="${e.pl}" data-v="subido" aria-label="Marcar subido en ${PL[e.pl]}" ${e.st==='produccion'?'disabled':''}><span class="pf ${e.pl}"><b></b></span>${PL[e.pl]}</button>`).join('');
  return `<div class="task ${p.ch} ${allDone?'done':''}" data-card="${p.id}">
    <img class="${p.kind==='largo'?'h':''}" src="${esc(p.img)}" alt="">
    <div style="min-width:0"><div class="t">${esc(ptitle(p))}</div>
      <div class="meta"><span class="chip ${p.ch}">${esc(chName(p.ch))}</span>${p.kind==='short'?`<span>Short ${p.n}/5 · ${esc(p.ep)}</span>`:''}${prod?'<span>En producción</span>':''}</div>
      <div class="acts">${p.dl?`<button class="btn sm pri" data-dl="${p.id}">⬇ Vídeo</button>`:''}<button class="btn sm" data-open="${p.id}">Copys</button></div>
      <div class="lab" style="margin-top:10px">Toca al subir</div><div class="acts" style="margin-top:5px">${plBtns}</div></div></div>`;
}
function dayBlock(d,split){
  let gs=grouped(events().filter(e=>e.d===d)); if(!gs.length) return '';
  if(split){const done=gs.filter(g=>g.pls.every(e=>e.st==='subido'));gs=gs.filter(g=>!done.includes(g));
    const doneHtml=done.length?`<details class="more donebox"><summary>✓ Ya subido hoy (${done.length})</summary><div class="agl" style="margin-top:10px">${done.map(agItem).join('')}</div></details>`:'';
    if(!gs.length) return `<div class="banner okb">🎉 Todo lo de hoy está subido.</div>`+doneHtml;
    const times=[...new Set(gs.map(g=>g.t))];
    return times.map(t=>`<div class="timehead"><b>${t}</b><span class="lab">hora España</span></div><div class="tasks">${gs.filter(g=>g.t===t).map(taskCard).join('')}</div>`).join('')+doneHtml;}
  const times=[...new Set(gs.map(g=>g.t))];
  return times.map(t=>`<div class="timehead"><b>${t}</b><span class="lab">hora España</span></div><div class="tasks">${gs.filter(g=>g.t===t).map(taskCard).join('')}</div>`).join('');
}
function monet(ch){const r=S.stats.filter(s=>s.ch===ch&&s.pl==='yt'&&s.f!=null).sort((a,b)=>a.date<b.date?-1:1).at(-1);const f=r?.f||0,p=Math.min(100,f/10);
  return `<a class="monet" href="#meta" data-metach="${ch}" style="text-decoration:none;color:inherit"><div class="row" style="justify-content:space-between"><span class="lab">💰 Monetización YouTube ›</span><b>${fmt(f)} / 1.000</b></div><i><b style="width:${Math.max(1.5,p)}%"></b></i><small>Toca para ver tu línea de tiempo y ponerte un objetivo.</small></a>`}
function seriesIssues(){const out=[];const by={};for(const p of S.posts)if(p.kind==='short'&&p.ep)(by[p.ep]||=[]).push(p);
  for(const [ep,ps] of Object.entries(by)){ps.sort((a,b)=>a.n-b.n);for(const pl of ['yt','tt','ig'])for(let i=1;i<ps.length;i++){const a=ps[i-1],b=ps[i];const wa=a.plan?.[pl],wb=b.plan?.[pl];if(!wa||!wb)continue;if(a.st?.[pl]==='subido'&&b.st?.[pl]==='subido')continue;if(wb<wa)out.push({ep,pl,a,b})}}return out}
function viewHoy(){
  const td=today(), ev=events();
  const late=grouped(ev.filter(e=>e.d<td && e.st!=='subido'));
  let d=td; const todayEv=ev.filter(e=>e.d===td);
  const doneN=todayEv.filter(e=>e.st==='subido').length, totN=todayEv.length;
  const nextDay=[...new Set(ev.filter(e=>e.d>td).map(e=>e.d))][0];
  const k=ch=>['yt','tt','ig'].map(pl=>{const r=S.stats.filter(s=>s.ch===ch&&s.pl===pl).sort((a,b)=>a.date<b.date?-1:1);const l=r.at(-1),pr=r.at(-2);const dl=l&&pr?l.f-pr.f:null;return `<div class="kpi"><div class="lab">${PL[pl]}</div><div class="v">${fmt(l?.f)}</div><div class="d ${dl>0?'up':dl<0?'down':''}">${dl?(dl>0?'+':'')+dl:(l?(pl==='yt'?'suscriptores':'seguidores'):'sin datos')}</div></div>`}).join('');
  const chs=S.channels.slice().sort((a,b)=>a.order-b.order).filter(c=>c.status!=='proximamente').map(c=>c.status==='nuevo'?`<a class="soon" href="#canal" data-chopen="${c.id}" style="text-decoration:none;color:inherit"><span class="lab" style="color:inherit">En preparación</span><b>${esc(c.name)}</b><span style="font-size:13px">${esc(c.theme||'')}</span></a>`:c.status!=='activo'?'':`<div class="panel kcard ${c.id}"><div class="row" style="justify-content:space-between"><div class="chead">${logo(c.id)}<div><h2>${esc(c.name)}</h2><span class="lab">${esc(c.theme||'')}</span></div></div><a href="#datos" class="lab" style="color:var(--link)">Ver datos</a></div><div class="kpis">${k(c.id)}</div>${monet(c.id)}</div>`).join('');
  const notes=S.notes.filter(n=>!n.done).sort((a,b)=>a.order-b.order);
  const alert=late.length?`<button class="ialert" data-alert><span class="iic" aria-hidden="true">⏰</span><span class="itx"><span class="iapp">CENTRO DE CANALES <em>ahora</em></span><b>${late.length} ${late.length===1?'tarea vencida':'tareas vencidas'}</b><span>${esc(late.slice(0,2).map(g=>ptitle(g.p)).join(' · '))}${late.length>2?' y más':''}</span></span></button>`:'';
  const hr=nowSpainHour(), greet=hr<6?'Buenas noches':hr<13?'Buenos días':hr<21?'Buenas tardes':'Buenas noches';
  const pct=totN?doneN/totN:0, C=2*Math.PI*42, tom=addDays(td,1), tomN=grouped(ev.filter(e=>e.d===tom)).length;
  const projN=S.drafts.filter(d=>d.saved&&projStage(d)<4).length, vPend=S.voices.filter(v=>v.status!=='usada'&&v.status!=='recibida').length+S.drafts.filter(d=>vStatusOfDraft(d)!=='recibida'&&projStage(d)<3).length;
  const fol=S.channels.filter(c=>c.status==='activo').reduce((n,c)=>n+['yt','tt','ig'].reduce((m,pl)=>{const r=S.stats.filter(s=>s.ch===c.id&&s.pl===pl&&s.f!=null).sort((a,b)=>a.date<b.date?-1:1).at(-1);return m+(r?.f||0)},0),0);
  const hero=`<section class="hero2"><div class="hcopy"><span class="hdate">${esc(dlong(td).toUpperCase())}</span><h1 class="hgreet">${greet}</h1><p class="hsub">${totN?(totN-doneN?`Hoy te quedan <b>${totN-doneN}</b> de ${totN} subidas.`:'Todo lo de hoy está subido. 🎉'):'Hoy no hay nada programado.'}</p></div>
    ${totN?`<svg class="hring" viewBox="0 0 100 100" role="img" aria-label="${doneN} de ${totN} hechas"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--sunk)" stroke-width="10"/><circle cx="50" cy="50" r="42" fill="none" stroke="url(#hg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 50 50)"/><defs><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="var(--acc-2)"/><stop offset="1" stop-color="var(--acc)"/></linearGradient></defs><text x="50" y="47" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${doneN}/${totN}</text><text x="50" y="64" text-anchor="middle" font-size="9.5" fill="var(--muted)">hechas</text></svg>`:''}</section>
    <a class="monbtn" href="#meta"><span class="mb1">💰</span><span><b>MONETIZANDO</b><small>${(()=>{const c=S.channels.filter(c=>c.status==='activo').sort((a,b)=>a.order-b.order)[0];if(!c)return '';const st=chStats(c.id),e=eta(1000-st.subs,st.sRate);return `${esc(c.name)}: ${fmt(st.subs)}/1.000 · ${e.d?'faltan ≈ '+e.d+' días':'pon tu objetivo'}`})()}</small></span><span class="mbar"><i style="width:${(()=>{const c=S.channels.filter(c=>c.status==='activo').sort((a,b)=>a.order-b.order)[0];return c?Math.max(2,Math.min(100,chStats(c.id).subs/10)):0})()}%"></i></span><span aria-hidden="true">›</span></a>
    <nav class="qtiles" aria-label="Accesos rápidos"><a href="#proyectos" class="qt q1"><span class="qi">⭐️</span><b>Proyectos</b><small>${projN?projN+' en marcha':'Crea el siguiente'}</small></a><a href="#voces" class="qt q2"><span class="qi">🎙️</span><b>Voces</b><small>${vPend?vPend+' pendientes':'Al día'}</small></a><a href="#calendario" class="qt q3"><span class="qi">📅</span><b>Calendario</b><small>Mañana: ${tomN} piezas</small></a><a href="#datos" class="qt q4"><span class="qi">📊</span><b>Datos</b><small>${fmt(fol)} seguidores</small></a></nav>`;
  const si=seriesIssues();
  const alert2=si.length?`<button class="ialert warn" data-open="${si[0].b.id}"><span class="iic" aria-hidden="true">🔀</span><span class="itx"><span class="iapp">ORDEN DE LA SERIE</span><b>${si.length===1?'Una parte sale antes que la anterior':si.length+' partes salen antes que la anterior'}</b><span>${esc(si[0].ep)} · ${PL[si[0].pl]}: Parte ${si[0].b.n} antes que la Parte ${si[0].a.n}. Toca para cambiar la fecha.</span></span></button>`:'';
  return alert+alert2+hero+`${totN?`<section class="sec"><h2 style="margin:0">Hoy toca</h2><span class="sub" style="margin:0">Descarga el vídeo, copia los textos y marca cada red al subirla.</span></section>`:''}
    ${late.length?`<section class="sec" id="late"><h2 class="down">Atrasado (${late.length})</h2><div class="tasks">${late.map(taskCard).join('')}</div></section>`:''}
    ${totN?`<section class="sec">${dayBlock(td,true)}</section>`:''}
    ${nextDay?`<section class="sec"><details class="more" ${totN?'':'open'}><summary>${dlong(nextDay)} · ${grouped(ev.filter(e=>e.d===nextDay)).length} piezas</summary><div class="sec" style="margin-top:10px">${dayBlock(nextDay)}</div></details></section>`:''}
    ${tipsBox()}
    <section class="sec"><h2>Seguidores</h2><div class="kgrid">${chs}<a class="addch" href="#canal"><span>＋</span><b>Añadir canal</b><small>Te hago unas preguntas y preparo nombre, logo, banner, estilo y temas</small></a></div></section>
    ${notes.length?`<a class="panel linkrow" href="#datos"><span>💡 <b>${notes.length} ${notes.length===1?'ajuste':'ajustes'} en prueba</b><span class="empty" style="display:block;font-size:13px">${esc(notes[0].title)}${notes.length>1?' y más':''}</span></span><span aria-hidden="true">›</span></a>`:''}`;
}

/* ---------- RENDIMIENTO ---------- */
const median=a=>{if(!a.length)return 0;const b=a.slice().sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function isNew(p){const td=today(),lim=addDays(td,-2);return pfs(p).some(pl=>{const w=p.plan?.[pl];return w&&w.slice(0,10)>lim&&w.slice(0,10)<=td&&p.st?.[pl]==='subido'})||(p.newUntil&&p.newUntil>=td)}
const newBadge=p=>isNew(p)?'<span class="nbadge">NUEVO</span>':'';
let _medC=null,_medK='';
function meds(){const k=S.posts.length+':'+S.posts.reduce((n,p)=>n+JSON.stringify(p.m||{}).length,0);if(k===_medK)return _medC;const m={};
  for(const p of S.posts){if(p.kind!=='short')continue;for(const pl of ['yt','tt','ig']){const v=p.m?.[pl]?.v;if(v)(m[p.ch+pl]||=[]).push(v)}}
  _medC=Object.fromEntries(Object.entries(m).map(([k,a])=>[k,median(a)]));_medK=k;return _medC}
/* tag per post+platform: 🔥 en racha · 🚀 despegando · 📈 bien · 💤 lento */
function perf(p,pl){
  const v=p.m?.[pl]?.v; if(!v) return null;
  const h=Object.entries(p.mh||{}).map(([d,x])=>[d,x?.[pl]]).filter(x=>x[1]!=null).sort((a,b)=>a[0]<b[0]?-1:1);
  if(h.length>=2){const [,a]=h.at(-2),[,b]=h.at(-1); if(a>=50&&(b-a)/a>=0.5) return {e:'🚀',t:'Despegando',c:'up',tip:`+${fmt(b-a)} vistas desde la última captura`};}
  const md=meds()[p.ch+pl]; if(p.kind!=='short'||!md) return null;
  if(v>=md*1.8&&v>=500) return {e:'🔥',t:'En racha',c:'fire',tip:`${(v/md).toFixed(1)}× lo normal en ${PL[pl]}`};
  if(v>=md*1.15) return {e:'📈',t:'Va bien',c:'ok',tip:'por encima de lo normal'};
  if(v<=md*0.5) return {e:'💤',t:'Lento',c:'slow',tip:'por debajo de lo normal'};
  return null;
}
function bestPerf(p){const order=['🚀','🔥','📈','💤'];let best=null;for(const pl of pfs(p)){const r=perf(p,pl);if(r&&(!best||order.indexOf(r.e)<order.indexOf(best.e)))best={...r,pl}}return best}
const perfChip=(r,short)=>r?`<span class="pchip ${r.c}" title="${esc(r.tip)}">${r.e}${short?'':' '+r.t}</span>`:'';

/* ---------- HEATMAP por país ---------- */
/* Países de habla hispana: zona horaria y peso aproximado de público hispano en redes. */
const COUNTRIES=[['es','España','Europe/Madrid',10],['mx','México','America/Mexico_City',27],['co','Colombia','America/Bogota',11],['ar','Argentina','America/Argentina/Buenos_Aires',10],
 ['pe','Perú','America/Lima',7],['ve','Venezuela','America/Caracas',6],['cl','Chile','America/Santiago',5],['ec','Ecuador','America/Guayaquil',4],['gt','Guatemala','America/Guatemala',3],
 ['do','Rep. Dominicana','America/Santo_Domingo',2],['bo','Bolivia','America/La_Paz',2],['hn','Honduras','America/Tegucigalpa',2],['py','Paraguay','America/Asuncion',1.5],
 ['sv','El Salvador','America/El_Salvador',1.5],['ni','Nicaragua','America/Managua',1],['cr','Costa Rica','America/Costa_Rica',1],['pa','Panamá','America/Panama',1],
 ['uy','Uruguay','America/Montevideo',1],['cu','Cuba','America/Havana',1],['pr','Puerto Rico','America/Puerto_Rico',1],['gq','Guinea Ecuatorial','Africa/Malabo',0.2]];
const tzOff=tz=>{try{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date()).map(x=>[x.type,x.value]));const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);return Math.round((asUTC-Date.now())/36e5)}catch(e){return 0}};
const pref=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
let heatView=pref('heatView','es'), heatAud=pref('heatAud','all');
const HOURS=[...Array(24)].map((_,i)=>i);
function baseScore(wd,h){ // hora LOCAL del público. wd: 0=lun..6=dom
  const we=wd>=5; let s=0.06; const bump=(c,w,a)=>{const d=Math.min(Math.abs(h-c),24-Math.abs(h-c));s+=a*Math.exp(-(d*d)/(2*w*w))};
  if(we){bump(12,1.4,0.55);bump(17.5,1.6,0.5);bump(21,1.3,0.75)}else{bump(7.5,0.8,0.18);bump(13.5,1,0.6);bump(19,1,0.5);bump(21.5,1.2,0.85)}
  if(wd===4||wd===5)bump(23,1,0.2); return Math.min(1,s);
}
function heatData(viewCode){
  const view=COUNTRIES.find(c=>c[0]===(viewCode||heatView))||COUNTRIES[0], vo=tzOff(view[2]), es=tzOff('Europe/Madrid');
  const aud=heatAud==='all'?COUNTRIES:COUNTRIES.filter(c=>c[0]===heatAud); const offs=aud.map(c=>[tzOff(c[2]),c[3]]); const W=offs.reduce((n,x)=>n+x[1],0);
  const own={};
  for(const p of S.posts){if(p.kind!=='short')continue;for(const pl of ['yt','tt','ig']){const w=p.plan?.[pl],v=p.m?.[pl]?.v,md=meds()[p.ch+pl];if(!w||!v||!md)continue;
    let h=+w.slice(11,13)+(vo-es),wd=(new Date(w.slice(0,10)+'T12:00:00Z').getUTCDay()+6)%7; while(h<0){h+=24;wd=(wd+6)%7} while(h>23){h-=24;wd=(wd+1)%7}
    (own[wd+'|'+h]||=[]).push(Math.min(3,v/md))}}
  const g=[];let mx=0;
  for(let wd=0;wd<7;wd++)for(const h of HOURS){let b=0;for(const [o,w] of offs){let lh=h+(o-vo),lwd=wd;while(lh<0){lh+=24;lwd=(lwd+6)%7}while(lh>23){lh-=24;lwd=(lwd+1)%7}b+=w*baseScore(lwd,lh)}b/=W;g.push({wd,h,b,n:0})}
  mx=Math.max(...g.map(c=>c.b));for(const c of g){c.b/=mx;const o=own[c.wd+'|'+c.h];c.sc=o?Math.min(1,0.6*c.b+0.4*Math.min(1,median(o)/2)):c.b;c.n=o?.length||0}
  return {g,ownN:Object.values(own).reduce((n,a)=>n+a.length,0),view};
}
const hh=h=>String(h).padStart(2,'0')+':00';
function bestHours(g,we){const t={};g.filter(c=>(c.wd>=5)===we&&c.h>=8).forEach(c=>t[c.h]=(t[c.h]||0)+c.sc);const pick=[];for(const [h] of Object.entries(t).sort((a,b)=>b[1]-a[1])){if(pick.every(x=>Math.min(Math.abs(x-h),24-Math.abs(x-h))>=2))pick.push(+h);if(pick.length===3)break}return pick.sort((a,b)=>a-b).map(hh).join(' · ')}
function heatBox(){
  const {g,ownN,view}=heatData(); const D=['L','M','X','J','V','S','D'];
  const opt=(sel,all)=>(all?`<option value="all" ${sel==='all'?'selected':''}>Todo el público hispano</option>`:'')+COUNTRIES.map(c=>`<option value="${c[0]}" ${sel===c[0]?'selected':''}>${c[1]}</option>`).join('');
  return `<section class="panel sec heat"><div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="margin:0">Mejores horas para subir</h2><span class="lab">hora de ${esc(view[1])}</span></div>
   <div class="hsel"><label>Ver en hora de<select data-heat="view">${opt(heatView,false)}</select></label><label>Público<select data-heat="aud">${opt(heatAud,true)}</select></label></div>
   <div class="tips2"><div><span class="lab">Lunes a viernes</span><b>${bestHours(g,false)}</b></div><div><span class="lab">Fin de semana</span><b>${bestHours(g,true)}</b></div></div>
   <div class="hgrid" role="img" aria-label="Mapa de calor por día y hora"><span></span>${HOURS.map(h=>`<span class="hh">${h%3===0?String(h).padStart(2,'0'):''}</span>`).join('')}
   ${D.map((dn,wd)=>`<span class="hd ${wd>=5?'we':''}">${dn}</span>${HOURS.map(h=>{const c=g.find(x=>x.wd===wd&&x.h===h);return `<i style="--a:${(0.06+c.sc*0.94).toFixed(2)}" title="${dn} ${hh(h)} · ${Math.round(c.sc*100)}%${c.n?' · '+c.n+' tuyos':''}"></i>`}).join('')}`).join('')}</div>
   <div class="row hleg"><span>Menos</span><i style="--a:.12"></i><i style="--a:.4"></i><i style="--a:.7"></i><i style="--a:1"></i><span>Más</span><span class="empty" style="margin-left:auto">${ownN?`Referencia de público + ${ownN} resultados tuyos`:'Referencia de público; se ajusta sola con tus resultados'}</span></div>
   <p class="empty" style="margin:0;font-size:11.5px">Las horas recomendadas son entre las 08:00 y las 24:00 de tu país; de madrugada también hay público, pero no cuenta para recomendar.</p>
   <button class="btn pri" data-fitheat style="width:100%">🕒 Ajustar horario de mis contenidos al mapa de calor</button></section>`;
}

/* ---------- AJUSTAR HORARIOS ---------- */
function nowSpainHour(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return +p.hour+(+p.minute)/60}
const fitS={scope:'todos',wd:null,we:null,skipped:0};
function bestList(we){ // top-3 hours (Spain time) for weekdays or weekend, best first
  const {g}=heatData('es'); const t={},n={};g.filter(c=>(c.wd>=5)===we&&c.h>=8).forEach(c=>{t[c.h]=(t[c.h]||0)+c.sc;n[c.h]=(n[c.h]||0)+1});
  const out=[];for(const [h,v] of Object.entries(t).sort((a,b)=>b[1]-a[1])){if(out.every(x=>Math.abs(x.h-h)>=2))out.push({h:+h,sc:v/n[h]});if(out.length===3)break}return out;
}
function planFit(){
  const td=today(), nowH=nowSpainHour(); fitS.skipped=0;
  const {g}=heatData('es'); const score=(wd,h)=>g.find(c=>c.wd===wd&&c.h===h)?.sc||0;
  const groups=new Map();
  for(const p of S.posts)for(const pl of pfs(p)){const w=p.plan?.[pl];if(!w)continue;const st=p.st?.[pl]||'listo';if(st==='subido'||st==='produccion')continue;const d=w.slice(0,10);if(d<td)continue;
    const wd=(new Date(d+'T12:00:00Z').getUTCDay()+6)%7, we=wd>=5; if(fitS.scope==='semana'&&we||fitS.scope==='finde'&&!we) continue;
    const k=d+'|'+p.ch+'|'+pl;(groups.get(k)||groups.set(k,[]).get(k)).push({p,pl,d,wd,we,t:w.slice(11,16)})}
  const moves=[];
  for(const [,es] of groups){const {d,wd,we}=es[0]; es.sort((a,b)=>a.t.localeCompare(b.t)||a.p.order-b.p.order);
    const minH=d===td?Math.ceil(nowH+0.5):0; let hs=[...(we?fitS.we:fitS.wd)].filter(h=>h>=minH);
    if(hs.length<es.length){fitS.skipped++;continue}
    hs=hs.sort((a,b)=>score(wd,b)-score(wd,a)).slice(0,es.length).sort((a,b)=>a-b);
    const L=es.filter(e=>e.p.kind==='largo'), R=es.filter(e=>e.p.kind!=='largo'); const rest=hs.slice();
    for(const e of L){const best=rest.filter(h=>h>=19).sort((a,b)=>score(wd,b)-score(wd,a))[0]??rest.at(-1);rest.splice(rest.indexOf(best),1);moves.push({...e,nt:String(best).padStart(2,'0')+':00'})}
    R.forEach((e,i)=>moves.push({...e,nt:String(rest[i]).padStart(2,'0')+':00'}));}
  const m=new Map();for(const x of moves){if(x.nt===x.t)continue;const k=x.p.id+'|'+x.d+'|'+x.t+'|'+x.nt;if(!m.has(k))m.set(k,{u:{p:x.p,d:x.d,t:x.t,pls:[]},nt:x.nt});m.get(k).u.pls.push(x.pl)}
  return [...m.values()].sort((a,b)=>(a.u.d+a.nt).localeCompare(b.u.d+b.nt));
}
function fitHours(we){
  const L=bestList(we), key=we?'we':'wd'; if(!fitS[key]) fitS[key]=new Set(L.slice(0,2).map(x=>x.h));
  const tone=['g','y','r'], lab=['La mejor','Buena','Aceptable'];
  return `<div class="fhrs"><span class="lab">${we?'Fin de semana':'Lunes a viernes'} · elige las horas</span><div class="fhrow">${L.map((x,i)=>`<button class="fhb ${tone[i]}" data-fh="${key}" data-h="${x.h}" aria-pressed="${fitS[key].has(x.h)}"><b>${hh(x.h)}</b><small>${lab[i]} · ${Math.round(x.sc*100)}%</small></button>`).join('')}</div></div>`;
}
function fitBody(){
  for(const we of [false,true]){const k=we?'we':'wd';if(!fitS[k])fitS[k]=new Set(bestList(we).slice(0,2).map(x=>x.h))}
  const ch=planFit(); fitPop.cur=ch; const sc=fitS.scope, opt=(v,l)=>`<button data-fs="${v}" aria-pressed="${sc===v}">${l}</button>`;
  return `<div class="row" style="justify-content:space-between"><b>Ajustar horarios</b><button class="btn sm" data-popx aria-label="Cerrar">✕</button></div>
   <div class="seg fseg" role="group" aria-label="Qué días">${opt('semana','Entre semana')}${opt('finde','Fin de semana')}${opt('todos','Todos')}</div>
   ${sc!=='finde'?fitHours(false):''}${sc!=='semana'?fitHours(true):''}
   <p class="empty" style="margin:0;font-size:12px">🟢 la mejor para ese momento · 🟡 buena · 🔴 aceptable. Marca las que quieras usar (hacen falta tantas como reels haya ese día por red; normalmente 2).</p>
   ${fitS.skipped?`<p class="down" style="margin:0;font-size:12.5px">${fitS.skipped} ${fitS.skipped===1?'día no cabe':'días no caben'} con las horas marcadas y se quedan como están.</p>`:''}
   ${ch.length?`<div class="fitl">${ch.map(c=>`<div>${logo(c.u.p.ch,'clogo xs')}<span class="ft"><b>${esc(c.u.p.kind==='largo'?'▶ '+c.u.p.epTitle:c.u.p.name)}</b><small>${dshort(c.u.d)} · ${c.u.pls.map(p=>PL[p]).join(', ')}</small></span><span class="fh"><s>${c.u.t}</s> → <b>${c.nt}</b></span></div>`).join('')}</div>
   <button class="btn pri" data-fitapply style="width:100%">Aplicar ${ch.length} ${ch.length===1?'cambio':'cambios'}</button>`:'<p class="empty" style="margin:0">Con esta selección no hay nada que mover. 👌</p>'}`;
}
function fitPop(){
  const el=document.createElement('div'); el.id='daypop'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Ajustar horarios');
  el.innerHTML=`<div class="popc fitc">${fitBody()}</div>`; closePop(); document.body.appendChild(el); el.querySelector('[data-popx]').focus();
}
function fitRefresh(){const c=document.querySelector('#daypop .fitc');if(c){const y=c.scrollTop;c.innerHTML=fitBody();c.scrollTop=y}}
async function fitApply(){
  const ch=fitPop.cur||[]; if(!ch.length||!db) return; closePop();
  const per=new Map(); for(const c of ch){const p=c.u.p;const plan=per.get(p.id)||{...(p.plan||{})};for(const pl of c.u.pls)plan[pl]=c.u.d+' '+c.nt;per.set(p.id,plan)}
  let n=0; for(const [id,plan] of per){const p=S.posts.find(x=>x.id===id);if(p)p.plan=plan;try{await db.collection('posts').doc(id).update({plan});n++}catch(e){}}
  render(); toast(n?`Horarios ajustados en ${n} ${n===1?'pieza':'piezas'}`:'No se pudo guardar');
}

const recent=p=>{const t=madeMs(p);return t>0&&Date.now()-t<12*36e5};

const cleanLen=t=>String(t||'').replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim().length;
function projChars(d){return d.kind==='short'?(d.shorts||[]).reduce((n,s)=>n+cleanLen(s.text),0):cleanLen(d.script)}

function vStatusOfDraft(d){return !d.script&&!(d.shorts||[]).length?'falta':!d.accepted?'guion':(d.audio||[]).length?'recibida':'pedida'}
const RULES=`REGLAS DE GUION (obligatorias):
- Público 18–45 años. La retención manda: cada frase tiene que ganarse el siguiente segundo.
- El primer segundo impacta: acción, imagen fuerte o dato absurdo. Nunca una presentación. Gancho favorito cuando encaje: «Te dijeron que X, ¿verdad? Pues la verdad es que no…».
- En los primeros 15 segundos deja claro qué va a ver, por qué le importa y por qué quedarse, y reafirma lo que promete el título.
- Gancho → desarrollo → cierre varias veces: bloques de 2–3 minutos, cada uno con su propio gancho y su remate.
- Al menos 2 bucles abiertos («al final te cuento cómo…») que se cierran todos antes del final.
- Cero relleno: frases cortas, ritmo alto; si una frase aburre a alguien que se aburre rápido, se corta.
- Escribe pensando en la imagen: algo nuevo cada 2–4 segundos; explica los procesos complejos de forma que se puedan animar.
- Hacia el 40 % del vídeo pide un comentario concreto con dos opciones votables (tipo «escribe ESPÍA o TRAIDOR») y retómalo al final.
- Hechos no demostrados: «presunto», «según…». Nada de detalles morbosos.
- Formato para ElevenLabs: solo el texto que dice el narrador, sin acotaciones ni títulos de escena; números en letra; usa puntos suspensivos y signos de interrogación para las pausas y el énfasis.`;
function chCtx(ch){const c=S.channels.find(x=>x.id===ch)||{};return `Canal: «${c.name||ch}» — ${c.theme||''}.${ch==='ytt'?' Se narra en segunda persona («tú»), como si le pasara al espectador.':''}${ch==='ao'?' Narrador que cuenta un caso real como un expediente, con tensión de thriller.':''}`}
function winnersCtx(){return S.posts.flatMap(p=>['yt','tt','ig'].filter(pl=>p.m?.[pl]?.v).map(pl=>`${p.name||p.epTitle} (${PL[pl]}: ${p.m[pl].v})`)).slice(0,8).join('; ')}
let ahorro=(()=>{try{return localStorage.getItem('ahorro')!=='0'}catch(e){return true}})();
async function sampler(){if(ahorro&&!confirm('Modo ahorro activado.\n\nEsto usa un poco de tu cuenta de Claude (mucho menos que un chat largo). ¿Continuar?'))throw {code:'cancelled_user'};if(sampleFn===undefined)sampleFn=await claude.use('sample');if(!sampleFn)throw {code:'unavailable'};return sampleFn}
function genErr(e){if(e?.code==='cancelled_user')return 'Cancelado. No se ha gastado nada.';return e?.code==='not_granted'?'Sin permiso para usar Claude aquí. Pídemelo por el chat y te lo escribo yo.':e?.code==='rate_limited'?'Demasiadas peticiones seguidas; prueba en un minuto.':e?.code==='unavailable'?'Aquí no se puede generar. Pídemelo por el chat.':'No salió bien. Prueba otra vez.'}
async function saveDraft(id,patch){const d=S.drafts.find(x=>x.id===id);if(d)Object.assign(d,patch);try{await db.collection('drafts').doc(id).update(patch)}catch(e){toast('No se pudo guardar')}}
async function genScript(id){
  const d=S.drafts.find(x=>x.id===id); if(!d||gen[id]?.busy) return; gen[id]={busy:'Escribiendo el guion con tus reglas de retención…'}; render();
  try{
    const sf=await sampler(); const prev=d.review?.mejoras?.length?`\nMejoras pendientes de la versión anterior (aplícalas): ${d.review.mejoras.join(' | ')}`:'';
    const extra=(d.params?`\nIndicaciones del creador: ${d.params}`:'')+(d.note?`\nNota: ${d.note}`:'')+prev;
    const base=`${chCtx(d.ch)}\nTema: ${d.title}${extra}\nLo que mejor les ha funcionado: ${winnersCtx()}\n\n${RULES}\n`;
    if(d.kind==='short'){
      const out=await sf.json(base+`\nEscribe una serie de 5 Shorts (Parte 1 a Parte 5) que cuentan UNA historia seguida. Cada Short: 35–50 segundos (650–900 caracteres). Estructura: GANCHO (0–3 s, la frase más fuerte) → PROBLEMA → GIRO; acaba con una pregunta abierta que responde la parte siguiente. No escribas el cierre hablado («sígueme…»): se añade solo. La Parte 5 cierra la historia y deja con ganas de ver el vídeo completo.\nResponde SOLO JSON: {"shorts":[{"title":"título corto del Short","text":"lo que dice el narrador"}]}`,{modelTier:'complex',cache:false});
      const shorts=(out?.shorts||[]).slice(0,5).map(s=>({title:String(s.title||'').slice(0,80),text:String(s.text||'')})); if(shorts.length<5) throw {code:'empty'};
      await saveDraft(id,{shorts,script:'',review:null,accepted:false,stage:0,chars:shorts.reduce((n,s)=>n+cleanLen(s.text),0),genAt:new Date().toISOString()});
    }else{
      gen[id].busy='Escribiendo la parte 1 de 2…'; render();
      const p1=(await sf(base+`\nEscribe la PARTE 1 de un vídeo largo de 10–12 minutos (esta parte: 5.500–6.500 caracteres). Abre con un gancho brutal, planta los bucles abiertos y llega hasta la petición de comentario (≈ 40 %). Termina la parte en un momento de máxima tensión. Devuelve solo el texto del narrador.`,{modelTier:'complex',cache:false})).text.trim();
      gen[id].busy='Escribiendo la parte 2 de 2…'; render();
      const p2=(await sf(base+`\nEsta es la PARTE 1 ya escrita:\n"""${p1}"""\n\nEscribe la PARTE 2 (5.500–6.500 caracteres): sigue la historia sin repetir, nuevos bloques gancho→desarrollo→cierre, cierra TODOS los bucles abiertos, retoma la petición de comentario y termina con: «Suscríbete y guarda este vídeo para que te salgan más historias como esta.» Devuelve solo el texto del narrador.`,{modelTier:'complex',cache:false})).text.trim();

      await saveDraft(id,{script,shorts:[],review:null,accepted:false,stage:0,chars:cleanLen(script),genAt:new Date().toISOString()});

async function reviewScript(id){

    const out=await sf.json(`Eres un editor de YouTube muy exigente, especialista en retención y vídeos virales en español. ${chCtx(d.ch)}\nTema: ${d.title}\nFormato: ${d.kind==='short'?'serie de 5 Shorts':'vídeo largo de 10–12 min'}\n\n${RULES}\n\nGUION:\n"""${txt}"""\n\nEvalúa con dureza y honestidad (un 90+ debe ser excepcional). Puntúa de 0 a 100: total, gancho (primeros segundos y promesa), desarrollo (ritmo, bloques, bucles abiertos, cero relleno), desenlace (cierre de bucles, final que satisface, pedido), retencion (probabilidad de que el espectador no se vaya).\nResponde SOLO JSON: {"total":0,"gancho":0,"desarrollo":0,"desenlace":0,"retencion":0,"veredicto":"una frase","fortalezas":["…","…","…"],"mejoras":["mejora concreta citando la frase a cambiar","…","…"],"titulos":["título ganador 1","2","3"]${d.kind==='largo'?',"shorts":[{"titulo":"…","gancho":"primera frase del Short"}]':''}}`,{modelTier:'default',cache:false});
    const n=v=>Math.max(0,Math.min(100,Math.round(+v||0)));
    const review={total:n(out.total),gancho:n(out.gancho),desarrollo:n(out.desarrollo),desenlace:n(out.desenlace),retencion:n(out.retencion),veredicto:String(out.veredicto||'').slice(0,200),
      fortalezas:(out.fortalezas||[]).slice(0,3).map(x=>String(x).slice(0,220)),mejoras:(out.mejoras||[]).slice(0,4).map(x=>String(x).slice(0,260)),titulos:(out.titulos||[]).slice(0,3).map(x=>String(x).slice(0,100)),
      shorts:(out.shorts||[]).slice(0,5).map(s=>({titulo:String(s.titulo||'').slice(0,80),gancho:String(s.gancho||'').slice(0,140)})),at:new Date().toISOString()};
    gen[id]={busy:null}; await saveDraft(id,{review}); render();

}
async function uploadVoice(id,file){
  const d=S.drafts.find(x=>x.id===id); if(!d||!file) return;
  if(file.size>20*1024*1024){toast('El audio pesa más de 20 MB: expórtalo en MP3 de menor calidad');return}
  gen[id]={busy:'Subiendo la voz…'}; render();

    const assets=await claude.use('assets'); if(!assets) throw {code:'noassets'};
    const secs=await new Promise(r=>{const a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>r(Math.round(a.duration)||null);a.onerror=()=>r(null);a.src=URL.createObjectURL(file)});
    const type=['video/mp4','video/webm'].includes(file.type)?file.type:'video/mp4';
    const up=await assets.upload(file,{type});

    gen[id]={busy:null}; await saveDraft(id,{audio,stage:Math.max(projStage(d),2)}); toast('Voz subida'); render();

}
async function dlUrl(url,name){try{if(dlCap===undefined)dlCap=await claude.use('downloads');const b=await (await fetch(url)).blob();if(dlCap)await dlCap.save({filename:name,data:b});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}}catch(err){if(err?.code!=='dismissed')toast('No se pudo descargar')}}
function meter(r){
  if(!r) return '';
  const col=v=>v>=80?'var(--ok)':v>=60?'#e0a200':'#e5484d', bar=(l,v)=>`<div class="mbar"><span>${l}</span><i><b style="width:${v}%;background:${col(v)}"></b></i><em>${v}</em></div>`;

function epPrefix(ch){const e=S.posts.filter(p=>p.ch===ch).map(p=>p.ep).find(Boolean);if(e)return e.replace(/\d+$/,'');const c=S.channels.find(x=>x.id===ch);return (c?.short||ch).toUpperCase().replace(/[^A-Z]/g,'').slice(0,4)||'EP'}
function nextEp(ch){const pre=epPrefix(ch);let mx=0,w=2;for(const p of S.posts)if(p.ch===ch&&p.ep?.startsWith(pre)){const m=p.ep.slice(pre.length);w=Math.max(w,m.length);mx=Math.max(mx,+m||0)}return {pre,code:(n)=>pre+String(n).padStart(w,'0'),n:mx}}
function placeholderFor(ch){return S.posts.find(p=>p.ch===ch&&p.kind==='largo'&&!p.projectId&&p.st?.yt==='produccion'&&!p.dl)}
const UPLOAD_H=[13,20]; /* horario fijo de subida elegido por el creador */
function slotHours(we){return UPLOAD_H.slice()}
function slotHoursHeat(we){const {g}=heatData('es');const t={};g.filter(c=>(c.wd>=5)===we&&c.h>=9).forEach(c=>t[c.h]=(t[c.h]||0)+c.sc);const two=[];for(const [h] of Object.entries(t).sort((a,b)=>b[1]-a[1])){if(two.every(x=>Math.abs(x-h)>=3))two.push(+h);if(two.length===2)break}return two.sort((a,b)=>a-b)}
function lastPlanned(ch){let mx=today();for(const p of S.posts)if(p.ch===ch)for(const w of Object.values(p.plan||{}))if(w&&w.slice(0,10)>mx)mx=w.slice(0,10);return mx}
const wdOf=d=>(new Date(d+'T12:00:00Z').getUTCDay()+6)%7;
async function planProject(id){
  const d=S.drafts.find(x=>x.id===id); if(!d||!db) return;
  gen[id]={busy:'Preparando calendario, copys y miniaturas…'}; render();
  try{
    const ph=d.kind==='largo'?placeholderFor(d.ch):null; const E=nextEp(d.ch);
    const ep=ph?.ep||E.code(E.n+1), base=ep.toLowerCase();
    /* dates: the long video on the placeholder's date or the day after the channel's last planned piece; shorts 2/day after it */
    let longD=ph?.plan?.yt?.slice(0,10)||addDays(lastPlanned(d.ch),1); if(longD<today())longD=addDays(today(),1);
    const longH=UPLOAD_H.at(-1);
    const titles=(d.kind==='short'?(d.shorts||[]).map(s=>s.title):(d.review?.shorts||[]).map(s=>s.titulo)).slice(0,5);
    while(titles.length<5)titles.push(`${d.title} · parte ${titles.length+1}`);
    const sd=[];let day=d.kind==='largo'?addDays(longD,1):longD;while(sd.length<5){const hs=slotHours(wdOf(day)>=5);for(const h of hs){if(sd.length<5)sd.push(day+' '+String(h).padStart(2,'0')+':00')}day=addDays(day,1)}
    /* copys with the house rules */
    let copy={};try{const sf=await sampler();copy=await sf.json(`${chCtx(d.ch)}\nEpisodio: ${d.title}\nTítulos posibles: ${(d.review?.titulos||[]).join(' | ')}\nShorts (en orden, son Partes 1–5): ${titles.join(' | ')}\n${d.kind==='largo'?'Guion (resumen): '+String(d.script||'').slice(0,2500):''}
Escribe los textos para subir. Reglas: público 18–45 en español; título ganador que se reafirma en los primeros segundos; las descripciones de Shorts empiezan EXACTAMENTE con «VIDEO COMPLETO EN EL LINK |» y no pasan de 100 caracteres; texto de Instagram con 5 hashtags; comentario fijado = votación con 2 opciones con emoji + adelanto de algo que solo está en el vídeo completo (nunca «¿qué opinas?»); hechos no probados con «presunto».
Responde SOLO JSON: {${d.kind==='largo'?'"largo":{"title":"…","alts":["…","…"],"desc":"descripción de YouTube con 3 párrafos cortos y CTA","tags":"12–18 etiquetas de YouTube separadas por comas (tema, personajes, búsquedas reales, nombre del canal), ≤ 450 caracteres","pin":"…"},':''}"shorts":[{"title":"título ≤100 con 1 emoji y 2 hashtags","desc":"VIDEO COMPLETO EN EL LINK | …","tags":"8–12 etiquetas de YouTube separadas por comas (tema, personajes, canal, shorts), ≤ 400 caracteres","ig":"…","tt":"…","pin":"…"}],"miniaturas":[{"idea":"escena y emoción","texto":"texto grande de 2–4 palabras","prompt":"prompt para ChatGPT, estilo cartoon 2D/3D del canal, 16:9"}]}`,{modelTier:'default',cache:false})}catch(e){copy={}}
    const writes=[];
    const order0=Math.max(0,...S.posts.filter(p=>p.ch===d.ch).map(p=>p.order||0));
    const img=logoUrl(d.ch)||'';
    if(d.kind==='largo'){const lc=copy.largo||{};
      writes.push([ph?.id||base+'-largo',{ch:d.ch,ep,epTitle:d.title,kind:'largo',n:0,name:'Vídeo largo',order:ph?.order??order0+1,img:ph?.img||img,thumbs:[],cover:null,m:{},projectId:id,
        plan:{yt:longD+' '+String(longH).padStart(2,'0')+':00'},st:{yt:'produccion'},copy:{title:lc.title||d.review?.titulos?.[0]||d.title,alts:lc.alts||d.review?.titulos?.slice(1)||[],desc:lc.desc||'',tags:lc.tags||'',pin:lc.pin||''}}]);}
    for(let i=0;i<5;i++){const sc=(copy.shorts||[])[i]||{};
      writes.push([base+'-s'+(i+1),{ch:d.ch,ep,epTitle:d.title,kind:'short',n:i+1,name:titles[i],order:order0+2+i,img,thumbs:[],cover:null,m:{},projectId:id,
        plan:{yt:sd[i],tt:sd[i],ig:sd[i]},st:{yt:'produccion',tt:'produccion',ig:'produccion'},copy:{title:sc.title||titles[i],desc:sc.desc||'VIDEO COMPLETO EN EL LINK | '+titles[i],ig:sc.ig||'',tt:sc.tt||'',pin:sc.pin||'',tags:sc.tags||'',cierre:'siguiente parte'}}]);}
    for(const [pid,data] of writes){const ex=S.posts.find(p=>p.id===pid);try{if(ex)await db.collection('posts').doc(pid).update(data);else await db.collection('posts').doc(pid).set(data)}catch(e){}}
    await saveDraft(id,{ep,posts:writes.map(w=>w[0]),thumbIdeas:(copy.miniaturas||[]).slice(0,3),plannedAt:new Date().toISOString()});
    gen[id]={busy:null}; toast('📅 En el calendario: '+writes.length+' piezas'); render();
  }catch(e){gen[id]={busy:null,msg:genErr(e)};render()}
}

function chart(rows,color){
  if(rows.length<2) return `<p class="empty" style="font-size:13px;margin:6px 0 0">${rows.length?`${rows[0].f} hoy. La línea aparece con la próxima captura.`:'Sin datos todavía.'}</p>`;
  const W=300,H=110,P=24,xs=rows.map((_,i)=>P+i*(W-P-12)/(rows.length-1)),mx=Math.max(...rows.map(r=>r.f))||1,ys=rows.map(r=>H-20-(r.f/mx)*(H-38));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución"><line x1="${P}" x2="${W-12}" y1="${H-20}" y2="${H-20}" stroke="var(--line)"/><polyline fill="none" stroke="${color}" stroke-width="2.5" points="${xs.map((x,i)=>x+','+ys[i]).join(' ')}"/>${xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="3.5" fill="${color}"/>`).join('')}<text x="${xs.at(-1)}" y="${ys.at(-1)-8}" text-anchor="end" font-size="11" fill="var(--ink)">${rows.at(-1).f}</text><text x="${P}" y="${H-5}" font-size="10" fill="var(--muted)">${rows[0].date.slice(5)}</text><text x="${W-12}" y="${H-5}" font-size="10" text-anchor="end" fill="var(--muted)">${rows.at(-1).date.slice(5)}</text></svg>`;
}
function spark(rows,color){
  if(rows.length<2) return '';
  const W=120,H=30,xs=rows.map((_,i)=>2+i*(W-4)/(rows.length-1)),vals=rows.map(r=>r.f??0),mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,ys=vals.map(v=>H-3-((v-mn)/rg)*(H-6));
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" points="${xs.map((x,i)=>x+','+ys[i]).join(' ')}"/></svg>`;
}

const cap={stage:'idle',rows:[],vids:[],imgs:[],msg:''};
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/video completo en (el link|el canal)\s*\|?/g,'').replace(/#\w+/g,'').replace(/[^a-z0-9ñ ]+/g,' ').split(/\s+/).filter(w=>w.length>2&&!['los','las','del','que','una','con','por','para','como','sus','fue','era'].includes(w));
function matchPost(title,ch,pl){const tw=new Set(norm(title));if(!tw.size)return null;let best=null,bs=0;
  for(const p of S.posts){if(ch&&S.channels.some(c=>c.id===ch)&&p.ch!==ch)continue;const cands=[p.name,p.epTitle,p.copy?.title,p.copy?.ig,p.copy?.tt,(p.copy?.alts||[]).join(' ')].filter(Boolean);
    for(const c of cands){const cw=new Set(norm(c).slice(0,18));let inter=0;tw.forEach(w=>{if(cw.has(w))inter++});const sc=inter/Math.min(tw.size,Math.max(cw.size,1));if(sc>bs){bs=sc;best=p.id}}}

async function readCaps(files){
  files=[...files].filter(f=>f.type.startsWith('image/')).slice(0,8); if(!files.length) return;
  cap.imgs.forEach(u=>URL.revokeObjectURL(u)); cap.imgs=files.map(f=>URL.createObjectURL(f)); cap.stage='reading'; cap.msg=''; render();
  try{
    await sampler();
    const chs=S.channels.filter(c=>c.status==='activo').map(c=>`- id "${c.id}": ${c.name} (YouTube "${c.yt||''}", Instagram "${c.ig||''}", TikTok "${c.tt||''}")`).join('\n');
    const out=await sampleFn.json(`Lee estas capturas de estadísticas de redes sociales (YouTube Studio, TikTok o Instagram).
Canales posibles:
${chs}
Devuelve SOLO este JSON: {"rows":[{"ch":"id del canal","pl":"yt"|"tt"|"ig","f":suscriptores o seguidores (número entero) o null,"v":vistas totales del canal (número entero) o null,"vp":"periodo de las vistas tal como aparece, por ejemplo '28 días', o null","h":horas de reproducción (número) o null,"note":"qué captura es, máximo 6 palabras"}],"videos":[{"ch":"id del canal o null","pl":"yt"|"tt"|"ig","title":"título del vídeo tal como aparece; si no hay título, el texto grande que se lee en la miniatura","v":vistas o reproducciones (entero),"l":me gusta (entero) o null,"c":comentarios (entero) o null}]}
"rows": una fila por cada canal y plataforma con datos del canal (seguidores, vistas totales); si dos capturas son del mismo canal y plataforma, júntalas. "videos": cada vídeo, Short o reel que aparezca con sus números (listas de contenido, cuadrículas de perfil, «contenido principal»…). Convierte "4.8 K" en 4800, "1,2 mil" en 1200 y "2.563" en 2563. Identifica el canal por su nombre, usuario o avatar.`,{images:files,modelTier:'default'});
    const ok=new Set(S.channels.map(c=>c.id));
    cap.rows=(out?.rows||[]).filter(r=>ok.has(r.ch)&&PL[r.pl]).map(r=>({ch:r.ch,pl:r.pl,f:Number.isFinite(+r.f)&&r.f!==null?Math.round(+r.f):null,v:Number.isFinite(+r.v)&&r.v!==null?Math.round(+r.v):null,vp:r.vp||'',h:Number.isFinite(+r.h)&&r.h!==null?+r.h:null,note:r.note||''}));
    const n0=v=>Number.isFinite(+v)&&v!==null&&v!==''?Math.round(+v):null;
    cap.vids=(out?.videos||[]).filter(x=>PL[x.pl]&&n0(x.v)!=null).map(x=>{const pid=matchPost(x.title,x.ch,x.pl);return {title:String(x.title||'').slice(0,120),ch:ok.has(x.ch)?x.ch:(S.posts.find(p=>p.id===pid)?.ch||null),pl:x.pl,v:n0(x.v),l:n0(x.l),c:n0(x.c),pid}});
    cap.stage='review';
  }catch(e){
    cap.stage='idle';
    cap.msg=e?.code==='not_granted'?'Sin permiso para leer capturas. Mándamelas por el chat y las apunto yo.':e?.code==='rate_limited'?'Demasiadas seguidas. Prueba en un minuto.':e?.code==='unavailable'||e?.code==='images_unavailable'?'Aquí no se pueden leer capturas. Mándamelas por el chat y las apunto yo.':'No pude leerlas. Prueba otra vez o mándamelas por el chat.';
  }
  render();
}
async function saveCaps(){
  if(!db) return; const date=today(); let n=0;
  for(const r of cap.rows){ if(r.f==null&&r.v==null) continue; const row={date,ch:r.ch,pl:r.pl,f:r.f,v:r.v,vp:r.vp||null,h:r.h,note:r.note||'Desde captura'};
    try{await db.collection('stats').doc(`${date}_${r.ch}_${r.pl}`).set(row);n++}catch(err){} }
  const per=new Map();for(const x of cap.vids){if(!x.pid)continue;const p=S.posts.find(q=>q.id===x.pid);if(!p)continue;const cur=per.get(p.id)||{m:JSON.parse(JSON.stringify(p.m||{})),mh:JSON.parse(JSON.stringify(p.mh||{}))};
    cur.m[x.pl]={...(cur.m[x.pl]||{}),v:x.v,...(x.l!=null?{l:x.l}:{}),...(x.c!=null?{c:x.c}:{})};(cur.mh[date]||={})[x.pl]=x.v;per.set(p.id,cur)}
  for(const [id,u] of per){try{await db.collection('posts').doc(id).update({m:u.m,mh:u.mh});n++}catch(err){}}
  cap.stage='idle'; cap.rows=[]; cap.vids=[]; cap.imgs.forEach(u=>URL.revokeObjectURL(u)); cap.imgs=[]; render(); toast(n?`${n} ${n===1?'dato guardado':'datos guardados'}`:'No se pudo guardar');
}

/* smooth, app-like transitions between tabs and screens */
const ORDER=['hoy','calendario','contenido','voces','datos','proyectos','canal','meta'];
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastRoute=route();
function transition(update,dir){
  const app=$('#app'); document.documentElement.dataset.dir=dir||'fwd';
  if(reduceMotion()){update();return}
  if(document.startViewTransition){const vt=document.startViewTransition(()=>{update()});vt.ready?.catch(()=>{});vt.finished?.catch(()=>{});vt.updateCallbackDone?.catch(()=>{});return}
  update(); app.classList.remove('enter-fwd','enter-back'); void app.offsetWidth; app.classList.add('enter-'+(dir||'fwd'));
}
function go(update,dir){transition(()=>{update();scrollTo(0,0)},dir)}

  if(e.target.id!=='statform') return; e.preventDefault(); if(!db) return;
  const g=i=>$(i).value,num=v=>v===''?null:Number(v);
  const row={date:g('#sf-date'),ch:g('#sf-ch'),pl:g('#sf-pl'),f:num(g('#sf-f')),v:num(g('#sf-v')),vp:g('#sf-vp'),note:g('#sf-note')};
  try{await db.collection('stats').doc(`${row.date}_${row.ch}_${row.pl}`).set(row);toast('Captura guardada')}catch(err){toast('No se pudo guardar')}
});
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close()});
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches?.('details[data-sec]'))return;d.open?openSecs.add(d.dataset.sec):openSecs.delete(d.dataset.sec);if(d.dataset.sec==='howto'&&!d.open)openSecs.add('howto-seen');try{localStorage.setItem('contOpen',JSON.stringify([...openSecs]))}catch(err){}},true);
/* day summary popup: double click or long press on a calendar day */
function dayPop(d){
  const gs=grouped(events().filter(e=>e.d===d)); const ev=events().filter(e=>e.d===d);
  const by=(f)=>ev.reduce((m,e)=>{const k=f(e);m[k]=(m[k]||0)+1;return m},{});
  const ch=by(e=>e.p.ch), pl=by(e=>e.pl), done=ev.filter(e=>e.st==='subido').length, L=gs.filter(g=>g.p.kind==='largo').length;
  const el=document.createElement('div'); el.id='daypop'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Resumen del día');
  el.innerHTML=`<div class="popc"><div class="row" style="justify-content:space-between"><b>${dlong(d)}</b><button class="btn sm" data-popx aria-label="Cerrar">✕</button></div>
   <div class="pbig"><span class="num">${ev.length}</span><span>publicaciones<br><small>${gs.length} piezas · ${L?L+' vídeo largo · ':''}${done} subidas</small></span></div>
   <div class="prows">${Object.entries(ch).map(([c,n])=>`<div>${logo(c,'clogo xs')}<span>${esc(chName(c))}</span><b>${n}</b></div>`).join('')}
   ${Object.entries(pl).map(([p,n])=>`<div><span class="pf ${p}"><b></b>${PL[p]}</span><span></span><b>${n}</b></div>`).join('')}</div>
   ${ev.length?`<button class="btn pri" data-goday="${d}" style="width:100%">Ver la lista del día</button>`:'<p class="empty" style="margin:0">Nada programado.</p>'}</div>`;
  closePop(); document.body.appendChild(el); el.querySelector('[data-popx]').focus();
}
function closePop(){document.getElementById('daypop')?.remove()}
addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
let clickT=null;
document.addEventListener('dblclick',e=>{const dy=e.target.closest('[data-day]');if(dy){e.preventDefault();clearTimeout(clickT);dayPop(dy.dataset.day)}});
let lpT=null;
document.addEventListener('pointerdown',e=>{const dy=e.target.closest('[data-day]');if(!dy)return;clearTimeout(lpT);lpT=setTimeout(()=>{dy._lp=true;navigator.vibrate?.(15);dayPop(dy.dataset.day)},480)});
['pointerup','pointercancel','pointerleave','scroll'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lpT),true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-day]'))e.preventDefault()});

(async()=>{
  const fail=setTimeout(()=>{if(!Object.values(S.ready).every(Boolean))$('#app').innerHTML='<div class="banner">No llegan los datos. Comprueba que tienes la sesión de claude.ai iniciada y recarga.</div>'},10000);
  db=await claude.use('db');
  if(!db){clearTimeout(fail);$('#sync span').textContent='Sin conexión';$('#app').innerHTML='<div class="banner">Abre esta página con tu sesión de claude.ai iniciada para ver tus datos.</div>';return}
  for(const c of ['channels','posts','stats','notes','tips','ideas','voices','drafts','goals']) db.collection(c).onSnapshot(snap=>{
    S[c]=snap.docs.map(d=>({id:d.id,...d.data()})); S.ready[c]=true;
    if(Object.values(S.ready).every(Boolean)){clearTimeout(fail);$('#sync').classList.add('on');$('#sync span').textContent='Guardado'}
    const a=document.activeElement; if(!(a&&a.closest&&(a.closest('#statform')||a.closest('#capbox')||a.closest('#createform')||a.closest('#projd')||a.closest('#chanform')||a.matches('input.when'))))render();
  },err=>{clearTimeout(fail);$('#sync span').textContent='Error';$('#app').innerHTML='<div class="banner">No se pudieron cargar los datos. Recarga la página.</div>'});
})();
</script>
